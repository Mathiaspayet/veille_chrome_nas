# =====================================================================
#  Chrome sur le NAS + robot + pont MCP pour Claude
# =====================================================================
#
#  Ce fichier décrit 4 « conteneurs » (des mini-ordinateurs isolés
#  qui tournent sur le NAS) :
#
#   1. chrome : un navigateur Chromium allumé en permanence.
#      Tu l'ouvres depuis ton PC dans un onglet de ton navigateur
#      (https://IP-DU-NAS:3001) pour te connecter toi-même à tes sites.
#      Tes connexions (cookies) sont gardées dans donnees/chrome.
#
#   2. robot : un petit programme Python qui pilote ce même Chrome
#      (ouvrir une page, cliquer, remplir un panier...). Il ne démarre
#      pas tout seul : on le lance à la demande (voir README).
#
#   3. pont-mcp : Playwright MCP (de Microsoft), qui donne à Claude des
#      outils pour piloter ce même Chrome. Il n'a aucun mot de passe :
#      il n'est joignable que par le portier.
#
#   4. portier : la porte d'entrée sécurisée du pont. Claude doit y être
#      autorisé (OAuth, avec l'identifiant et le mot de passe de
#      reglages.env) ; les outils dangereux du pont y sont bloqués.
#
#  On ne lance pas ce fichier directement : c'est le script
#  chrome-nas.sh (appelé par le Planificateur de tâches) qui s'en charge.
#  Les réglages personnels (mot de passe...) sont dans reglages.env,
#  à créer à partir de reglages-exemple.env. Ce fichier n'est jamais
#  envoyé sur GitHub.
# =====================================================================

# Nom du projet : les conteneurs et images s'appellent toujours pareil,
# quel que soit le nom du dossier.
name: veille_chrome_nas

services:
  chrome:
    image: lscr.io/linuxserver/chromium:latest
    container_name: chrome-nas
    environment:
      # Numéros de l'utilisateur du NAS qui « possède » les fichiers
      # (trouvés automatiquement par chrome-nas.sh).
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Europe/Paris
      # Langue du système et de Chrome : français.
      - LC_ALL=fr_FR.UTF-8
      # Accès web en IPv4 seulement. Sans ce réglage, la page d'accès ne
      # démarre pas sur les NAS où l'IPv6 est désactivé.
      - DISABLE_IPV6=true
      # Identifiant + mot de passe demandés quand tu ouvres le Chrome
      # depuis ton PC. Obligatoires : sans eux, n'importe qui sur ton
      # réseau pourrait utiliser tes comptes connectés.
      - CUSTOM_USER=${CHROME_UTILISATEUR:?Crée le fichier reglages.env (voir reglages-exemple.env) et remplis CHROME_UTILISATEUR}
      - PASSWORD=${CHROME_MOT_DE_PASSE:?Crée le fichier reglages.env (voir reglages-exemple.env) et remplis CHROME_MOT_DE_PASSE}
    volumes:
      # Le profil Chrome (cookies, favoris, sessions) est enregistré ici,
      # sur le disque du NAS. Il survit aux redémarrages.
      - ./donnees/chrome:/config
      # Nos réglages de Chrome (« :ro » = en lecture seule) :
      #  - options-chrome.sh : ouvre la « prise » du robot (port 9222)
      #    et met Chrome en français, à chaque lancement ;
      #  - politiques.json : rouvre la session précédente au démarrage
      #    (tu restes connecté) et interdit d'enregistrer mots de passe
      #    et cartes bancaires dans ce Chrome.
      - ./reglages-chrome/options-chrome.sh:/etc/chromium.d/zz-veille-chrome-nas:ro
      - ./reglages-chrome/politiques.json:/etc/chromium/policies/managed/veille-chrome-nas.json:ro
    ports:
      # Seul le port 3001 (accès HTTPS) est ouvert, et seulement sur ton
      # réseau local. NE PAS le rediriger sur Internet depuis ta box.
      - "${PORT_CHROME:-3001}:3001"
      # Le portier du pont MCP (il partage le réseau de ce conteneur, d'où
      # sa présence ici). Ouvert sur 127.0.0.1 seulement : seul le proxy
      # inversé de DSM, sur le NAS lui-même, peut le joindre.
      - "127.0.0.1:${PORT_PONT_MCP:-8930}:8930"
    # Mémoire partagée : sans ça, Chrome plante sur les pages lourdes.
    shm_size: "1gb"
    restart: unless-stopped
    # À décommenter (enlever les #) seulement si l'écran reste noir
    # ou si Chrome plante au démarrage :
    # security_opt:
    #   - seccomp:unconfined
    labels:
      # Portée du Watchtower déjà en place sur le NAS (installé avec
      # gestion-locative, comme pour immo, menus-famille et
      # suivi-prix-essence). Ne pas la changer : c'est ce qui fait que
      # Chrome est mis à jour automatiquement, sans second Watchtower.
      - "com.centurylinklabs.watchtower.scope=gestion-locative"

  # Le robot ne porte PAS l'étiquette Watchtower : son image est fabriquée
  # sur le NAS (elle n'existe sur aucun registre à télécharger) et il ne
  # tourne que le temps d'un script. Il se met à jour avec la tâche
  # « Démarrer ».
  robot:
    build: ./robot
    container_name: robot-nas
    # Le robot partage le « réseau » du conteneur chrome : il voit sa
    # prise 9222 comme si elle était chez lui (adresse 127.0.0.1).
    network_mode: "service:chrome"
    depends_on:
      - chrome
    environment:
      - TZ=Europe/Paris
      # Pour que les captures t'appartiennent (et pas à « root »).
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      # Les scripts sont lus directement depuis ce dossier : tu peux les
      # modifier sans tout reconstruire.
      - ./robot/scripts:/app/scripts
      # Les captures d'écran prises par le robot arrivent ici.
      - ./donnees/captures:/app/captures
    # « profil robot » : le robot ne démarre PAS avec le reste.
    # On le lance à la demande avec : chrome-nas.sh robot NOM_DU_SCRIPT
    profiles:
      - robot

  # Le pont et le portier partagent le réseau du conteneur chrome, comme
  # le robot. Quand Watchtower recrée chrome (mise à jour), il doit donc
  # les redémarrer aussi pour les rebrancher : c'est pour ça qu'ils portent
  # l'étiquette de portée. « no-pull » lui dit de ne pas chercher à
  # télécharger leur image : elle est fabriquée sur le NAS (tâche
  # « Démarrer »).
  pont-mcp:
    build: ./pont-mcp
    container_name: pont-mcp
    network_mode: "service:chrome"
    depends_on:
      - chrome
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.scope=gestion-locative"
      - "com.centurylinklabs.watchtower.no-pull=true"

  portier:
    build: ./portier
    container_name: portier-mcp
    network_mode: "service:chrome"
    depends_on:
      - pont-mcp
    restart: unless-stopped
    # Tourne avec ton utilisateur du NAS (pas en « root »).
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=Europe/Paris
      # Les mêmes identifiant et mot de passe que pour ouvrir Chrome :
      # ce sont eux qu'il faut saisir pour autoriser Claude.
      - CHROME_UTILISATEUR=${CHROME_UTILISATEUR:?Crée le fichier reglages.env (voir reglages-exemple.env) et remplis CHROME_UTILISATEUR}
      - CHROME_MOT_DE_PASSE=${CHROME_MOT_DE_PASSE:?Crée le fichier reglages.env (voir reglages-exemple.env) et remplis CHROME_MOT_DE_PASSE}
    volumes:
      # Les autorisations données à Claude (empreintes des jetons) :
      # elles survivent aux redémarrages.
      - ./donnees/portier:/donnees
    labels:
      - "com.centurylinklabs.watchtower.scope=gestion-locative"
      - "com.centurylinklabs.watchtower.no-pull=true"
