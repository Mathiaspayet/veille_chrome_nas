# ====================================================================
#  GitHub Actions — tests, fabrication et publication des images
#
#  À chaque envoi sur `main` : les tests tournent, puis les 2 images
#  fabriquées par le projet (pont-mcp, portier) sont construites et
#  publiées sur GitHub Container Registry (ghcr.io). Sur le NAS, le
#  Watchtower (portée gestion-locative) les récupère dans les minutes qui
#  suivent.
#
#  Chaque lundi, les images sont refabriquées pour profiter des
#  correctifs de sécurité de Python et de Node (le portier est joignable
#  depuis Internet : il doit rester à jour).
#
#  Les tests conditionnent la publication : une image cassée ne doit
#  jamais atteindre le NAS, puisqu'elle y serait déployée automatiquement.
#  Une pull request est vérifiée (tests + fabrication) mais rien n'est
#  publié.
# ====================================================================

name: Tests et images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: portier/requirements.txt

      - name: Installation des dépendances
        run: pip install -r portier/requirements.txt pytest

      - name: Tests du portier
        working-directory: portier
        run: python -m pytest -q test_portier.py

      - name: Syntaxe du script du NAS
        run: bash -n chrome-nas.sh

  images:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [pont-mcp, portier]

    steps:
      - uses: actions/checkout@v7

      # Le pilote buildx par défaut du runner ne sait pas exporter de
      # cache : sans cette étape, `cache-to: type=gha` fait échouer le
      # build avec « Cache export is not supported for the docker driver ».
      - name: Préparation de buildx
        uses: docker/setup-buildx-action@v4

      - name: Connexion à GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io n'accepte que des minuscules (le propriétaire s'écrit
      # « Mathiaspayet » sur GitHub).
      - name: Nom de l'image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/veille_chrome_nas-${{ matrix.image }}" >> "$GITHUB_ENV"

      - name: Étiquettes de l'image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Fabrication et publication
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.image }}
          push: ${{ github.event_name != 'pull_request' }}
          # Toujours repartir de la dernière version de Python / Node.
          pull: true
          # Le DS1522+ est en x86_64.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
